# onlylogins configuration

[runtime]
environment = "local"
domain      = "onlylogins.net"

[users]
admins      = [2]

[http]
address   = "localhost"
port      = 3000
advertise = "http://localhost:3000"

[database]
path = "/tmp/onlylogins.database"

[memcache]
instances        = ["/tmp/mc.sock"]
dial-timeout     = "250ms"
default-ttl      = "15s"
idle-connections = 1

