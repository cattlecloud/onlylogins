{{define "head"}}
<div class="left">
  <a href="/" class="brand">
    <img class="brand-mark" src="/ui/images/onlylogins.svg" alt="" aria-hidden="true">
    <span class="brand-name">OnlyLogins</span>
  </a>
  <nav class="links" aria-label="Main">
    <a href="/share">Share</a>
    <a href="/export">Export</a>
    <a href="/patreon">Patreon</a>
  </nav>
</div>
<div class="right">
  <div class="session">
    {{if .Session.Active}}
    <a class="username" href="/profile" title="Your profile">{{.Section.Profile.Username}}</a>
    <form class="logout" method="post" action="/internal/logout" hx-post="/internal/logout" hx-swap="none">
      <button class="nav-button" type="submit">Sign out</button>
    </form>
    {{else}}
    <a class="nav-button login-link" href="/login">Log in</a>
    {{end}}
  </div>
</div>
{{end}}
