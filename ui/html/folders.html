{{define "middle"}}
<div class="middle folders">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="/">All folders</a>
  </nav>

  <section class="panel">
    <header class="page-head">
      <h1>New folder</h1>
      <p>Group related documents together.</p>
    </header>

    <form hx-post="/folders">
      <div class="field">
        <label for="folder-label">Folder name</label>
        <input
          type="text"
          id="folder-label"
          name="label"
          placeholder="favorites"
          pattern="[\p{L}\p{M}0-9-]+"
          title="letters (including accented), numbers, and dashes"
          autocomplete="off"
          aria-describedby="folder-label-help"
          required>
        <p id="folder-label-help" class="field-help">Letters, numbers, and dashes.</p>
      </div>

      <fieldset class="icon-picker">
        <legend>Icon</legend>
        {{range $k, $v := .Section.Icons}}
        <label class="icon-option">
          <input
            type="radio"
            name="icon"
            value="{{$k}}"
            {{if eq $k 0}}checked{{end}}>
          <img src="/{{Icon $k}}" alt="" aria-hidden="true">
          <span class="sr-only">{{$v}}</span>
        </label>
        {{end}}
      </fieldset>

      <div class="form-actions">
        <button type="submit">Create folder</button>
      </div>
      <span id="error"></span>
    </form>
  </section>
</div>
{{end}}
