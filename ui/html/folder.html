{{define "middle"}}
<div class="middle folder">
  <section>
    <h1>Add a document to <span>{{.Section.Name}}</span></h1>
    <form hx-post="/folders/{{.Section.Name}}">
      <div class="field">
        <label for="document-label">Document name</label>
        <input
          type="text"
          id="document-label"
          name="label"
          placeholder="name of document"
          pattern="[a-zA-Z0-9]+"
          title="alphanumeric letters or numbers only"
          autocomplete="off"
          required>
      </div>

      <button type="submit">Create</button>
    </form>
  </section>

  <section>
    <h2>Documents</h2>
    {{if .Section.Documents}}
    <ul class="documents-list">
      {{range .Section.Documents}}
      <li>
        <a href="/folders/{{$.Section.Name}}/{{.Label}}">{{.Label}}</a>
      </li>
      {{end}}
    </ul>
    {{else}}
    <p class="empty">No documents yet</p>
    {{end}}
  </section>
</div>
{{end}}
