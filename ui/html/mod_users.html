{{define "contains"}}
<div class="modpage users">

<h4>users</h4>

<div class="help">
  <p class="instructions">comprehensive list of users</p>
</div>

<div class="content">
  <table>
    <thead>
      <tr>
        <th>username</th>
        <th>id</th>
        <th>email</th>
        <th>standing</th>
        <th>manage</th>
      </tr>
    </thead>
    <tbody>
    {{range .Profiles}}
      <tr>
        <td>{{.Username}}</td>
        <td>{{.ID}}</td>
        <td>{{.Email}}</td>
        <td>{{.Standing}}</td>
        <td><a href="/moderate/users/{{.ID}}">open</a></td>
      </tr>
    {{end}}
    </tbody>
  </table>
</div>

</div>
{{end}}
