{{define "middle"}}
<div class="middle profile">
  <section class="user">
    <h1>profile</h1>

    <div class="row">
      <span class="key">username</span>
      <div class="value">{{.Section.Profile.Username}}</div>
    </div>

    <div class="row">
      <span class="key">plan</span>
      <div class="value plan">{{.Section.Profile.Usage.Plan.Label}}</div>
    </div>

    <div class="row">
      <span class="key">documents</span>
      <div class="value">
        {{.Section.Profile.Usage.Documents}} / {{.Section.Profile.Usage.Plan.DocumentsLimit}}
      </div>
    </div>
  </section>
</div>
{{end}}
