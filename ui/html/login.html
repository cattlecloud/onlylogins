<body>

    <span class="title">
      OnlyLogins

  <main>
    <article>
      <h1 class="explain">Choose how to login</h1>

      <!-- Google -->
      <form method="POST" action="/login/oauth">
        <input type="hidden" name="idp" value="google"/>

          </svg>
          <span>Sign in with Google</span>
        </button>
      </form>
