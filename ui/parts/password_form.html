{{define "password_form"}}
<form
  class="add-password-form"
  hx-post="/internal/password/create/{{.Folder}}/{{.Document}}"
>
  <div class="form-row">
    <input
      type="password" name="password"
      class="password-input"
      placeholder="password"
      autocomplete="new-password"
      required
      autofocus
      maxlength="256">
    <button type="submit" class="submit">Add</button>
    <button type="button" class="cancel"
      onclick="document.getElementById('passwords-form-container').innerHTML=''"
    >Cancel</button>
  </div>
  <p class="form-hint">
    Tip: use your browser's built-in password generator.
    <a href="/help#password-generator">Learn more</a>
  </p>
  <span id="error"></span>
</form>
{{end}}
