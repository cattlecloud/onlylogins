{{define "password_form"}}
<form
  class="add-password-form"
  hx-post="/internal/password/create/{{.Folder}}/{{.Document}}"
>
  <div class="form-row">
    <input
      type="text" name="password"
      class="password-input secret-input"
      placeholder="password"
      autocomplete="off"
      spellcheck="false"
      autocapitalize="off"
      autocorrect="off"
      data-1p-ignore
      data-lpignore="true"
      data-form-type="other"
      data-bwignore="true"
      required
      autofocus
      maxlength="256">
    <button
      type="button"
      class="secret-toggle-btn"
      title="Show"
      aria-label="Show password"
    ><img src="/ui/images/show.svg" alt="Show"></button>
    <button type="button" class="secret-generate-btn">Generate</button>
    <button type="submit" class="submit">Add</button>
    <button type="button" class="cancel"
      onclick="document.getElementById('passwords-form-container').innerHTML=''"
    >Cancel</button>
  </div>
  <p class="form-hint">
    Tip: use the Generate button to create a strong random password.
    <a href="/help#password-generator">Learn more</a>
  </p>
  <span id="error"></span>
</form>
{{end}}
