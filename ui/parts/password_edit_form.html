{{define "password_edit_form"}}
<li class="password-row editing">
  <form
    class="password-edit-form"
    hx-put="/internal/password/update/{{.Folder}}/{{.Document}}/{{.ID}}"
    hx-target="closest .password-row"
    hx-swap="outerHTML"
  >
    <div class="form-row">
      <input
        type="text" name="password"
        class="password-input secret-input"
        value="{{.Password}}"
        autocomplete="off"
        spellcheck="false"
        autocapitalize="off"
        autocorrect="off"
        data-1p-ignore
        data-lpignore="true"
        data-form-type="other"
        data-bwignore="true"
        required
        autofocus
        maxlength="256">
      <button
        type="button"
        class="secret-toggle-btn"
        title="Show"
        aria-label="Show password"
      ><img src="/ui/images/show.svg" alt="Show"></button>
      <button type="submit" class="submit">Update</button>
    </div>
    <span id="error"></span>
  </form>
</li>
{{end}}
