{{define "password_edit_form"}}
<li class="password-row editing">
  <form
    class="password-edit-form"
    hx-put="/internal/password/update/{{.Folder}}/{{.Document}}/{{.ID}}"
    hx-target="closest .password-row"
    hx-swap="outerHTML"
  >
    <div class="form-row">
      <input
        type="text" name="password"
        class="password-input"
        value="{{.Password}}"
        autocomplete="off"
        required
        autofocus
        maxlength="256">
      <button type="submit" class="submit">Update</button>
    </div>
    <span id="error"></span>
  </form>
</li>
{{end}}
