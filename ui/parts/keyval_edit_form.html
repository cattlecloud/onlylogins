{{define "keyval_edit_form"}}
<li class="keyval-row editing">
  <form
    class="keyval-edit-form"
    hx-put="/internal/keyval/update/{{.Folder}}/{{.Document}}/{{.ID}}"
    hx-target="closest .keyval-row"
    hx-swap="outerHTML"
  >
    <div class="form-row">
      <input
        type="text" name="key"
        class="keyval-key-input"
        value="{{.Key}}"
        autocomplete="off"
        data-1p-ignore
        data-lpignore="true"
        data-form-type="other"
        data-bwignore="true"
        required
        autofocus
        maxlength="256">
      <input
        type="text" name="value"
        class="keyval-value-input"
        value="{{.Value}}"
        autocomplete="off"
        data-1p-ignore
        data-lpignore="true"
        data-form-type="other"
        data-bwignore="true"
        required
        maxlength="1024">
      <button type="submit" class="submit">Update</button>
    </div>
    <span id="error"></span>
  </form>
</li>
{{end}}
