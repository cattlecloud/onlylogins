{{define "keyval_form"}}
<form
  class="add-keyval-form"
  hx-post="/internal/keyval/create/{{.Folder}}/{{.Document}}"
>
  <div class="form-row">
    <input
      type="text" name="key"
      class="keyval-key-input"
      placeholder="key"
      autocomplete="off"
      data-1p-ignore
      data-lpignore="true"
      data-form-type="other"
      data-bwignore="true"
      required
      autofocus
      maxlength="256">
    <input
      type="text" name="value"
      class="keyval-value-input"
      placeholder="value"
      autocomplete="off"
      data-1p-ignore
      data-lpignore="true"
      data-form-type="other"
      data-bwignore="true"
      required
      maxlength="1024">
    <button type="submit" class="submit">Add</button>
    <button type="button" class="cancel"
      onclick="document.getElementById('keyvals-form-container').innerHTML=''"
    >Cancel</button>
  </div>
  <span id="error"></span>
</form>
{{end}}
