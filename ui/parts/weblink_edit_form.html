{{define "weblink_edit_form"}}
<li class="weblink-row editing">
  <form
    class="weblink-edit-form"
    hx-put="/internal/weblink/update/{{.Folder}}/{{.Document}}/{{.ID}}"
    hx-target="closest .weblink-row"
    hx-swap="outerHTML"
  >
    <div class="form-row">
      <input
        type="text" name="url"
        class="url-input"
        value="{{.URL}}"
        autocomplete="off"
        data-1p-ignore
        data-lpignore="true"
        data-form-type="other"
        data-bwignore="true"
        required
        autofocus>
      <button type="submit" class="submit">Update</button>
    </div>
    <span id="error"></span>
  </form>
</li>
{{end}}
