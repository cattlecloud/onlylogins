{{define "password_row"}}
<li class="password-row" data-password="{{.Password}}">
  <code class="password-value">{{Mask .Password}}</code>
  <span class="password-actions">
    <button type="button" class="password-copy-btn" title="Copy">Copy</button>
    <button type="button" class="password-show-btn" title="Show">Show</button>
    <button class="password-edit-btn"
      hx-get="/internal/password/edit/{{.Folder}}/{{.Document}}/{{.ID}}"
      hx-target="closest .password-row"
      hx-swap="outerHTML"
      title="Edit"><img src="/ui/images/wrench.svg" alt="Edit"></button>
    <button class="password-delete-btn"
      hx-delete="/internal/password/delete/{{.Folder}}/{{.Document}}/{{.ID}}"
      hx-confirm="Delete this password?"
      hx-target="closest .password-row"
      hx-swap="delete"
      title="Delete"><img src="/ui/images/delete.svg" alt="Delete"></button>
  </span>
</li>
{{end}}
