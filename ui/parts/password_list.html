{{define "password_list"}}
<ul class="password-menu-list">
  {{range .Passwords}}
  {{$p := .Unlock $.Cypher}}
  <li class="password-row" data-password="{{$p}}">
    <code class="password-value">{{Mask $p}}</code>
    <span class="password-actions">
      <button type="button" class="password-copy-btn" title="Copy"><img src="/ui/images/copy.svg" alt="Copy"></button>
      <button type="button" class="password-show-btn" title="Show"><img src="/ui/images/show.svg" alt="Show"></button>
    </span>
  </li>
  {{end}}
</ul>
{{end}}
