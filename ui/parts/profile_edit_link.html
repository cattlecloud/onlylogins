{{define "profile_edit_link"}}
<div class="link" id="edit-link">
  <form
    hx-put="/internal/profile/edit?key=editlink"
    hx-swap="outerHTML"
    class="edit-form">
    <label class="link">link</label>
    <input
      type="text" id="value" name="value"
      value="{{.}}"
      maxlength="255"
      minlength="2"
      autocomplete="off">
    <button class="inline-button" type="submit">update</button>
  </form>
  <span id="error"></span>
</div>
{{end}}
